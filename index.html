<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5b35">
  <title>Merry Zoapmas - Helgtre edition</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <button class="round ghost" id="backBtn" aria-label="Terug" hidden>←</button>
      <div class="brand"><span>🎄</span><strong>Merry Zoapmas</strong><small>Helgtre edition</small></div>
      <button class="round ghost" id="soundBtn" aria-label="Geluid aan of uit">♫</button>
    </header>

    <section id="view" aria-live="polite"></section>
  </main>
  <nav id="nav" class="bottom-nav" hidden>
    <button data-screen="home">⌂<span>Start</span></button>
    <button data-screen="route">⌖<span>Route</span></button>
    <button data-screen="quiz">★<span>Quiz</span></button>
    <button data-screen="scoreboard">♛<span>Score</span></button>
    <button data-screen="selfie">◉<span>Selfie</span></button>
  </nav>
  <template id="toastTemplate"><div class="toast"></div></template>
  <script type="module" src="/app.js"></script>
</body>
</html>
